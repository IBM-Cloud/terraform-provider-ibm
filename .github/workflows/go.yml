name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  # IBM Cloud providers and SDKs (go-sdk-core, openapi-validator, softlayer-go)
  # run ibm/detect-secrets as a dedicated CI job on push and pull_request.
  # Keep this job independent of the Go build so secret leaks fail fast.
  detect-secrets:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v5.0.1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install IBM detect-secrets
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade "git+https://github.com/ibm/detect-secrets.git@0.13.1+ibm.64.dss#egg=detect-secrets"

    - name: Scan repository for secrets
      run: ./scripts/detect_secrets.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v5
      with:
        go-version: ^1.24
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v5.0.1

    - name: Verify go.mod and go.sum are tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum is not tidy. Please run 'go mod tidy' and commit the changes." && exit 1)

    - name: Run go fmt
      run: |
        fmt_output=$(gofmt -l .)
        if [ -n "$fmt_output" ]; then
          echo "The following files are not formatted correctly:"
          echo "$fmt_output"
          echo "Please run 'go fmt ./...' and commit the changes."
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Get dependencies
      run: |
        go get -v -t -d ./...
        if [ -f Gopkg.toml ]; then
            curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
            dep ensure
        fi

    - name: Build
      run: go build -v .

    - name: Test
      run: go test -v .
